<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FamilyOS Alpha 0.0.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f7f7f3;--surface:#fff;--text:#182126;--muted:#657276;--line:#dde4e2;--primary:#236b73;--primary2:#e3f0ef;--good:#2f7d59;--goodbg:#e8f4ed;--warn:#8d6417;--warnbg:#fff3d7;--danger:#a33c3c;--dangerbg:#fbe9e9;--shadow:0 12px 38px rgba(25,45,50,.10)}
*{box-sizing:border-box}html,body{margin:0;background:#dfe5e3;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}.app{width:min(100%,460px);min-height:min(900px,calc(100vh - 32px));background:var(--bg);border-radius:32px;box-shadow:var(--shadow);overflow:hidden}.screen{padding:24px 20px 38px}@media(max-width:520px){.stage{padding:0}.app{width:100%;min-height:100vh;border-radius:0}}h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0 0 10px}h2{font-size:19px;margin:0 0 10px}p{line-height:1.5;margin:0 0 12px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.brand{font-size:26px;font-weight:900;color:var(--primary)}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.card.warn{background:#fffbf2;border-color:#ecd69f}.card.good{background:#f8fcfa;border-color:#cce4d6}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{width:100%;min-height:50px;border:0;border-radius:15px;padding:13px 15px;background:var(--primary);color:white;font-weight:800}.btn.secondary{background:white;color:var(--primary);border:1px solid #abc9ca}.btn.ghost{background:transparent;color:var(--primary)}.btn.danger{background:var(--danger)}.btn.small{width:auto;min-height:38px;padding:8px 12px;border-radius:11px;font-size:13px}.btn:disabled{opacity:.5}.pill{display:inline-block;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:var(--warnbg);color:var(--warn)}.pill.good{background:var(--goodbg);color:var(--good)}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px}label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #cbd5d2;background:white;color:var(--text)}.banner{padding:13px 14px;border-radius:15px;background:var(--primary2);border:1px solid #c6dddc;margin:12px 0}.banner.error{background:var(--dangerbg);border-color:#eac0c0;color:#722c2c}.banner.good{background:var(--goodbg);border-color:#cce4d6;color:#225d43}.item{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;margin:8px 0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.avatar{width:42px;height:42px;border-radius:50%;background:#dcebea;color:var(--primary);display:grid;place-items:center;font-weight:900}.check{width:55px;height:55px;border-radius:50%;background:var(--goodbg);color:var(--good);display:grid;place-items:center;font-size:28px;margin-bottom:14px}.center{min-height:78vh;display:flex;flex-direction:column;justify-content:center}.diagnostics{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#162225;color:#dbeceb;border-radius:16px;padding:13px;white-space:pre-wrap;overflow:auto}
</style>
</head>
<body>
<div class="stage"><main class="app"><div id="root" class="screen"></div></main></div>
<script>
let sb;
const state={session:null,user:null,household:null,children:[],currentPhysical:null,actions:[],healthHistory:[],busy:false,msg:'',error:'',view:'loading'};
const root=document.getElementById('root');
function h(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function niceDate(v){if(!v)return'—';const d=new Date(v.length===10?v+'T12:00:00':v);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function notify(msg){state.msg=msg;state.error='';render();setTimeout(()=>{state.msg='';render()},2500)}
function fail(err){console.error(err);state.error=err?.message||String(err);state.msg='';render()}
function header(title,sub=''){return `<div class="topbar"><div><div class="eyebrow">FamilyOS Alpha 0.0.1</div><h1>${h(title)}</h1>${sub?`<div class="muted">${h(sub)}</div>`:''}</div>${state.user?`<div class="avatar">${h((state.user.email||'U')[0].toUpperCase())}</div>`:''}</div>`}
function messages(){return `${state.msg?`<div class="banner good"><strong>${h(state.msg)}</strong></div>`:''}${state.error?`<div class="banner error"><strong>Something went wrong</strong><p>${h(state.error)}</p></div>`:''}`}
async function initBackend(){const r=await fetch('/api/config');if(!r.ok)throw new Error('FamilyOS config unavailable');const c=await r.json();if(!c.url||!c.client)throw new Error('Vercel environment variables are missing.');sb=window.supabase.createClient(c.url,c.client,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
async function refreshSession(){const {data,error}=await sb.auth.getSession();if(error)throw error;state.session=data.session;state.user=data.session?.user||null}
async function loadApp(){state.error='';await refreshSession();if(!state.user){state.view='auth';render();return}const {data:households,error:hErr}=await sb.from('households').select('id,name,default_timezone').order('created_at',{ascending:true}).limit(1);if(hErr)throw hErr;state.household=households?.[0]||null;if(!state.household){state.view='setup';render();return}const {data:children,error:cErr}=await sb.from('children').select('id,preferred_name,date_of_birth,status').eq('household_id',state.household.id).eq('status','active').order('created_at');if(cErr)throw cErr;state.children=children||[];const jordan=state.children.find(c=>c.preferred_name.toLowerCase()==='jordan')||state.children[0];if(!jordan){state.view='child';render();return}const [p,a,hist]=await Promise.all([sb.from('health_records').select('*').eq('child_id',jordan.id).eq('record_type','sports_physical').eq('is_current',true).maybeSingle(),sb.from('actions').select('*').eq('child_id',jordan.id).in('status',['active','upcoming']).order('due_at',{ascending:true}),sb.from('health_records').select('*').eq('child_id',jordan.id).eq('record_type','sports_physical').order('created_at',{ascending:false})]);if(p.error)throw p.error;if(a.error)throw a.error;if(hist.error)throw hist.error;state.currentPhysical=p.data||null;state.actions=a.data||[];state.healthHistory=hist.data||[];state.view='home';render()}
async function signUp(ev){ev.preventDefault();state.busy=true;render();try{const f=new FormData(ev.target);const {data,error}=await sb.auth.signUp({email:f.get('email').trim(),password:f.get('password'),options:{data:{display_name:f.get('name').trim()},emailRedirectTo:window.location.origin+'/'}});if(error)throw error;if(data.session){await loadApp();notify('Account created ✓')}else{state.view='checkemail';render()}}catch(e){fail(e)}finally{state.busy=false;render()}}
async function signIn(ev){ev.preventDefault();state.busy=true;render();try{const f=new FormData(ev.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get('email').trim(),password:f.get('password')});if(error)throw error;state.session=data.session;state.user=data.user;await loadApp()}catch(e){fail(e)}finally{state.busy=false;render()}}
async function signOut(){state.busy=true;render();try{await sb.auth.signOut();Object.assign(state,{session:null,user:null,household:null,children:[],currentPhysical:null,actions:[],healthHistory:[],view:'auth'})}catch(e){fail(e)}finally{state.busy=false;render()}}
async function createHousehold(){state.busy=true;render();try{const {error}=await sb.rpc('create_household',{p_name:'Parker Family',p_default_locale:'en-US',p_default_timezone:'America/Chicago',p_measurement_system:'us'});if(error)throw error;await loadApp();notify('Parker Family created ✓')}catch(e){fail(e)}finally{state.busy=false;render()}}
async function createJordan(){state.busy=true;render();try{const {error}=await sb.rpc('create_child',{p_household_id:state.household.id,p_preferred_name:'Jordan',p_date_of_birth:'2014-05-14',p_photo_path:null});if(error)throw error;await loadApp();notify('Jordan added ✓')}catch(e){fail(e)}finally{state.busy=false;render()}}
async function createPhysical(){state.busy=true;render();try{const jordan=state.children.find(c=>c.preferred_name.toLowerCase()==='jordan')||state.children[0];const payload={household_id:state.household.id,child_id:jordan.id,record_type:'sports_physical',completed_date:today(),expiration_date:plusDays(20),provider_name:'Dr. Morgan',status:'cleared',notes:'Alpha 0.0.1 golden-loop test record',reminder_days_before:30,is_current:true,created_by:state.user.id};const {error}=await sb.from('health_records').insert(payload);if(error)throw error;await loadApp();notify('Sports physical saved — Action Engine fired ✓')}catch(e){fail(e)}finally{state.busy=false;render()}}
async function renewPhysical(){state.busy=true;render();try{const {error}=await sb.rpc('renew_health_record',{p_old_record_id:state.currentPhysical.id,p_completed_date:today(),p_expiration_date:plusDays(365),p_provider_name:'Dr. Morgan',p_status:'cleared',p_notes:'Renewed in Alpha 0.0.1',p_reminder_days_before:30});if(error)throw error;await loadApp();notify('Renewed — old record preserved ✓')}catch(e){fail(e)}finally{state.busy=false;render()}}
function renderAuth(){root.innerHTML=`${header('Welcome')}${messages()}<div class="card"><h2>Create a test account</h2><form onsubmit="signUp(event)"><label>Name</label><input name="name" value="Alex Parker" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="8" required><div style="height:14px"></div><button class="btn" ${state.busy?'disabled':''}>Create account</button></form></div><div class="card"><h2>Already confirmed?</h2><form onsubmit="signIn(event)"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><div style="height:14px"></div><button class="btn secondary" ${state.busy?'disabled':''}>Sign in</button></form></div><p class="tiny">Use fictional family/health data only.</p>`}
function renderCheckEmail(){root.innerHTML=`<div class="center"><div class="check">✉</div><h1>Check your email.</h1><p class="muted">Confirm the signup email, then return here and sign in.</p><button class="btn" onclick="state.view='auth';render()">Back to sign in</button></div>`}
function renderSetup(){root.innerHTML=`${header('Create the test household',state.user.email)}${messages()}<div class="card"><h2>Parker Family</h2><button class="btn" onclick="createHousehold()" ${state.busy?'disabled':''}>Create Parker Family</button></div><button class="btn ghost" onclick="signOut()">Sign out</button>`}
function renderChild(){root.innerHTML=`${header('Add Jordan',state.household?.name||'')}${messages()}<div class="card"><h2>Jordan Parker</h2><p class="muted">Birthday: May 14, 2014. Fictional Alpha data.</p><button class="btn" onclick="createJordan()" ${state.busy?'disabled':''}>Add Jordan</button></div>`}
function renderHome(){const jordan=state.children.find(c=>c.preferred_name.toLowerCase()==='jordan')||state.children[0];const active=state.actions.filter(a=>a.status==='active');const upcoming=state.actions.filter(a=>a.status==='upcoming');root.innerHTML=`${header('Good evening',state.household?.name||'')}${messages()}<div class="row"><div><strong>${h(jordan?.preferred_name||'No child')}</strong><div class="muted">Golden-loop test profile</div></div><button class="btn small secondary" onclick="loadApp()">Refresh</button></div>${!state.currentPhysical?`<div class="card"><span class="pill">Step 1</span><h2 style="margin-top:10px">Add Jordan’s sports physical</h2><p class="muted">This saves a real record and should generate an Action immediately.</p><button class="btn" onclick="createPhysical()">Add sports physical</button></div>`:''}${active.length?`<div class="card warn"><span class="pill">Needs attention</span><h2 style="margin-top:10px">${h(active[0].title)}</h2><p class="muted">Due ${niceDate(active[0].due_at)}</p><button class="btn" onclick="renewPhysical()">Renewed</button></div>`:''}${state.currentPhysical&&active.length===0?`<div class="card good"><span class="pill good">✓ All caught up</span><h2 style="margin-top:10px">Nothing needs your attention right now.</h2><p class="muted">Current physical expires ${niceDate(state.currentPhysical.expiration_date)}.</p></div>`:''}${upcoming.length?`<div class="card"><h2>Next cycle scheduled</h2><p class="muted">Becomes active ${niceDate(upcoming[0].available_from)}.</p></div>`:''}<div class="card"><h2>Physical history</h2>${state.healthHistory.length?state.healthHistory.map((r,i)=>`<div class="item"><strong>${r.is_current?'Current':'Previous'} physical</strong><div class="muted">Completed ${niceDate(r.completed_date)} · Expires ${niceDate(r.expiration_date)}</div></div>`).join(''):'<p class="muted">No physicals yet.</p>'}</div><div class="card"><h2>Live diagnostics</h2><div class="diagnostics">Authenticated: yes\nHousehold: ${h(state.household?.name||'none')}\nChildren: ${state.children.length}\nPhysical records: ${state.healthHistory.length}\nActive actions: ${active.length}\nUpcoming actions: ${upcoming.length}</div></div><button class="btn ghost" onclick="signOut()">Sign out</button>`}
function renderLoading(){root.innerHTML=`<div class="center"><div class="brand">FamilyOS</div><p class="muted">Connecting to the development backend…</p></div>`}
function render(){if(state.view==='loading')return renderLoading();if(state.view==='auth')return renderAuth();if(state.view==='checkemail')return renderCheckEmail();if(state.view==='setup')return renderSetup();if(state.view==='child')return renderChild();return renderHome()}
Object.assign(window,{signUp,signIn,signOut,createHousehold,createJordan,createPhysical,renewPhysical,loadApp,state,render});
render();initBackend().then(()=>{sb.auth.onAuthStateChange((_e,session)=>{state.session=session;state.user=session?.user||null;if(session&&state.view==='auth')setTimeout(()=>loadApp().catch(fail),0)});return loadApp()}).catch(fail);
</script>
</body></html>
